spring.application.name=game-leaderboard-api-test

# PostgreSQL Test Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/game_leaderboard_flyway_test}
spring.datasource.username=game_app
spring.datasource.password=${DB_PASSWORD}
app.expected-test-database=${EXPECTED_TEST_DATABASE:game_leaderboard_flyway_test}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}