
name: Publish Docker Image to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      POSTGRES_PASSWORD: ghcr_ci_test_only_2026

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package application
        run: ./mvnw -B clean package -DskipTests

      - name: Build local Docker image
        run: docker build -t game-leaderboard-api:1.0 .

      - name: Start Compose stack
        run: docker compose up -d --wait --wait-timeout 120

      - name: Verify API and cache
        run: |
          set -euo pipefail

          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8082/api/leaderboard \
              > /tmp/leaderboard.json; then
              break
            fi
            sleep 2
          done

          python3 - <<'PY'
          import json
          with open("/tmp/leaderboard.json") as f:
              assert json.load(f) == []
          PY

          STATUS=$(curl -sS -o /tmp/player.json \
            -w '%{http_code}' \
            -X POST http://localhost:8082/api/players \
            -H "Content-Type: application/json" \
            -d '{"id":101,"name":"DockerPlayer","score":3000}')

          test "$STATUS" = "201"

          curl -fsS http://localhost:8082/api/leaderboard \
            > /tmp/leaderboard.json

          python3 - <<'PY'
          import json
          with open("/tmp/leaderboard.json") as f:
              players = json.load(f)
          assert players == [{
              "id": 101,
              "name": "DockerPlayer",
              "score": 3000
          }], players
          PY

          DB_SCORE=$(docker compose exec -T postgres \
            psql -U game_app -d game_leaderboard \
            -tAc "SELECT score FROM players WHERE id=101")

          test "$DB_SCORE" = "3000"

          READY=$(docker compose exec -T redis \
            redis-cli --raw GET leaderboard:cache:v1:ready)

          SCORE=$(docker compose exec -T redis \
            redis-cli --raw ZSCORE leaderboard:cache:v1 player:101)

          NAME=$(docker compose exec -T redis \
            redis-cli --raw HGET leaderboard:cache:v1:names player:101)

          test "$READY" = "1"
          test "$SCORE" = "3000"
          test "$NAME" = "DockerPlayer"

          echo "Compose integration verification passed"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150

      - name: Clean up
        if: always()
        run: docker compose down -v --remove-orphans

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package application
        run: ./mvnw -B clean package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Define image tags
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/arm64
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ steps.image.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
