
name: Docker Compose Integration Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Package Spring Boot JAR
        run: ./mvnw -B clean package -DskipTests

      - name: Build Docker image
        run: docker build -t game-leaderboard-api:1.0 .

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start three containers
        run: docker compose up -d --wait --wait-timeout 120

      - name: Wait for Spring Boot HTTP API
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8082/api/leaderboard; then
              echo "Spring Boot API is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Spring Boot API did not become ready"
          exit 1

      - name: Test create player API
        run: |
          curl -fsS -o /tmp/player-response.json \
            -w '%{http_code}' \
            -X POST http://localhost:8082/api/players \
            -H "Content-Type: application/json" \
            -d '{"id":101,"name":"DockerPlayer","score":3000}' \
            | grep -qx '201'

          python3 -c '
          import json
          with open("/tmp/player-response.json") as f:
              data = json.load(f)
          assert data == {
              "id": 101,
              "name": "DockerPlayer",
              "score": 3000
          }, data
          print("POST /api/players passed")
          '

      - name: Test leaderboard API
        run: |
          curl -fsS http://localhost:8082/api/leaderboard \
            | python3 -c '
          import json
          import sys
          data = json.load(sys.stdin)
          assert data == [{
              "id": 101,
              "name": "DockerPlayer",
              "score": 3000
          }], data
          print("GET /api/leaderboard passed")
          '

      - name: Verify PostgreSQL data
        run: |
          RESULT=$(docker compose exec -T postgres \
            psql -U game_app -d game_leaderboard \
            -tAc "SELECT score FROM players WHERE id = 101;")
          test "$RESULT" = "3000"
          echo "PostgreSQL verification passed"

      - name: Verify Redis leaderboard cache
        run: |
          READY=$(docker compose exec -T redis \
            redis-cli --raw GET leaderboard:cache:v1:ready)

          SCORE=$(docker compose exec -T redis \
            redis-cli --raw ZSCORE leaderboard:cache:v1 player:101)

          NAME=$(docker compose exec -T redis \
            redis-cli --raw HGET leaderboard:cache:v1:names player:101)

          test "$READY" = "1"
          test "$SCORE" = "3000"
          test "$NAME" = "DockerPlayer"

          echo "Redis cache verification passed"

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=150

      - name: Clean up CI containers
        if: always()
        run: docker compose down -v --remove-orphans
